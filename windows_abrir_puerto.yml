---
- name: Abrir el puerto TCP 11100 en el Firewall de Windows
  hosts: windows
  gather_facts: false
  tasks:
    - name: Permitir tráfico TCP al puerto 11100 desde cualquier origen
      community.windows.win_firewall_rule:
        name: Veyon2
        localport: 11100
        protocol: tcp
        direction: in
        action: allow
        state: present
        enabled: true
        profiles:
          - Domain
          - Private
          - Public
        remoteip: any
